{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-4">
        <h3 class="card-title text-center mb-4">Registrar Nova Conta</h3>

        <form method="POST" action="{{ url_for('auth.register') }}">

            <div class="mb-3">
                <label for="name" class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
                <div class="form-text">
                    Se usar um email institucional (.edu, .ifrs.edu.br), você receberá acesso de Estudante.
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary">Criar Conta</button>
            </div>

        </form>

        <hr>

        <div class="text-center">
            <p class="mb-0">Já tem uma conta?</p>
            <a href="{{ url_for('auth.login') }}">Faça login aqui</a>
        </div>

    </div>
</div>
{% endblock %}
