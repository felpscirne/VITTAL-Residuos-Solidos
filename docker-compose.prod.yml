services:
  db:
    image: postgres:16
    container_name: vittal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vittal-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: 5432
      DB_WAIT_TIMEOUT: 90
      SECRET_KEY: ${SECRET_KEY}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT}
      FLASK_DEBUG: "False"
      TRUST_PROXY_HEADERS: "True"
      AUTO_MIGRATE_ON_STARTUP: "True"
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      CACHE_TYPE: ${CACHE_TYPE:-FileSystemCache}
      CACHE_DEFAULT_TIMEOUT: ${CACHE_DEFAULT_TIMEOUT:-3600}
      CACHE_THRESHOLD: ${CACHE_THRESHOLD:-500}
      MANAGEMENT_SECRET_CODE: ${MANAGEMENT_SECRET_CODE:-}
      OPERATOR_SECRET_CODE: ${OPERATOR_SECRET_CODE:-}
      ENABLE_OUTBOUND_EMAIL: ${ENABLE_OUTBOUND_EMAIL:-False}
      SECURITY_CONFIRMABLE: ${SECURITY_CONFIRMABLE:-False}
      SECURITY_SEND_REGISTER_EMAIL: ${SECURITY_SEND_REGISTER_EMAIL:-False}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-True}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
    expose:
      - "5000"
    command:
      - gunicorn
      - --workers
      - ${GUNICORN_WORKERS:-3}
      - --threads
      - ${GUNICORN_THREADS:-2}
      - --timeout
      - ${GUNICORN_TIMEOUT:-120}
      - --bind
      - 0.0.0.0:5000
      - wsgi:app

  nginx:
    image: nginx:1.27-alpine
    container_name: vittal-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

volumes:
  postgres_data:
